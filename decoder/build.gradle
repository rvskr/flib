plugins {
    id 'com.android.library' version '9.3.0'
}

android {
    namespace 'rezkatv.mpeg4.decoder'
    compileSdk 36

    defaultConfig {
        minSdk 24
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64' }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -fexceptions -frtti'
                // Keep the JNI wrapper self-contained; FFmpeg remains separately shared.
                arguments '-DANDROID_STL=c++_static'
            }
        }
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt' }
    }
}

dependencies {
    api 'androidx.annotation:annotation:1.9.1'
    api 'androidx.media3:media3-exoplayer:1.11.1'
}

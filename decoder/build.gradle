plugins {
    id 'com.android.library' version '9.3.0'
    id 'maven-publish'
}

android {
    namespace 'io.github.rvskr.flib.mpeg4'
    compileSdk 36

    defaultConfig {
        minSdk 24
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64' }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -fexceptions -frtti'
                // Keep the JNI wrapper self-contained; FFmpeg remains separately shared.
                arguments '-DANDROID_STL=c++_static'
            }
        }
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt' }
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    api 'androidx.annotation:annotation:1.9.1'
    api 'androidx.media3:media3-exoplayer:1.11.1'
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = 'io.github.rvskr.flib'
            artifactId = 'mpeg4-decoder'
            version = providers.gradleProperty('releaseVersion').orElse('0.1.0-SNAPSHOT').get()
            afterEvaluate {
                from components.release
            }
            pom {
                name = 'FLib MPEG-4 Part 2 decoder'
                description = 'Media3 software video renderer for MPEG-4 Part 2 on Android'
                url = 'https://github.com/rvskr/flib'
                licenses {
                    license {
                        name = 'GNU Lesser General Public License v2.1 or later'
                        url = 'https://www.gnu.org/licenses/old-licenses/lgpl-2.1.html'
                    }
                }
                scm {
                    url = 'https://github.com/rvskr/flib'
                    connection = 'scm:git:https://github.com/rvskr/flib.git'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'localRelease'
            url = uri(providers.gradleProperty('publicationDirectory')
                .orElse("${rootProject.projectDir}/build/maven-repository").get())
        }
    }
}

name: Build MPEG-4 Part 2 decoder

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes git make nasm patchelf

      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build minimal FFmpeg shared libraries
        run: bash build_ffmpeg_android.sh
        env:
          ANDROID_API: "24"

      - name: Build standalone Media3 decoder AAR
        run: ./gradlew :decoder:assembleRelease --no-daemon --max-workers=2

      - name: Prepare versioned Maven repository
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch origin maven:maven
          git worktree add .maven-branch maven
          VERSION="${GITHUB_REF_NAME#v}"
          test ! -e ".maven-branch/io/github/rvskr/flib/mpeg4-decoder/$VERSION"

      - name: Publish release to Maven repository
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew :decoder:publishReleasePublicationToLocalReleaseRepository \
            -PreleaseVersion="$VERSION" \
            -PpublicationDirectory="$GITHUB_WORKSPACE/.maven-branch" \
            --no-daemon --max-workers=2

      - name: Push versioned Maven repository
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git -C .maven-branch config user.name github-actions
          git -C .maven-branch config user.email github-actions@users.noreply.github.com
          git -C .maven-branch add io/github/rvskr/flib/mpeg4-decoder
          git -C .maven-branch commit -m "Publish mpeg4-decoder $VERSION"
          git -C .maven-branch push origin maven

      - name: Package ABI-specific AARs
        run: python3 package_abi_aars.py

      - name: Package matching FFmpeg source and notices
        run: |
          mkdir -p dist
          git -C .build/ffmpeg-7.1.1 archive --format=tar HEAD | gzip -9 > dist/ffmpeg-n7.1.1-source.tar.gz
          cp build_ffmpeg_android.sh FFMPEG_BUILD_INFO.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: flib-mpeg4-decoder-release
          path: |
            decoder/build/outputs/aar/decoder-release.aar
            dist/*
          if-no-files-found: error
          retention-days: 90

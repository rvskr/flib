name: Build MPEG-4 Part 2 decoder

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes git make nasm patchelf

      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build minimal FFmpeg shared libraries
        run: bash build_ffmpeg_android.sh
        env:
          ANDROID_API: "24"

      - name: Build standalone Media3 decoder AAR
        run: ./gradlew :decoder:assembleRelease --no-daemon --max-workers=2

      - name: Package matching FFmpeg source and notices
        run: |
          mkdir -p dist
          git -C .build/ffmpeg-7.1.1 archive --format=tar HEAD | gzip -9 > dist/ffmpeg-n7.1.1-source.tar.gz
          cp build_ffmpeg_android.sh FFMPEG_BUILD_INFO.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: flib-mpeg4-decoder-release
          path: |
            decoder/build/outputs/aar/decoder-release.aar
            dist/*
          if-no-files-found: error
          retention-days: 90
